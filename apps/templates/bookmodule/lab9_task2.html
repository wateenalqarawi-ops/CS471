{% extends "layouts/base.html" %}
{% block content %}
<h2>Publishers Total Stock</h2>
<table border="1">
    <tr>
        <th>Publisher</th>
        <th>Total Book Stock</th>
    </tr>
    {% for pub in publishers %}
    <tr>
        <td>{{ pub.name }}</td>
        <td>{{ pub.total_stock|default:0 }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock content %}
