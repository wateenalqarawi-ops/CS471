{% extends "layouts/base.html" %}
{% block content %}
<h2>List of Books (Using Django Forms)</h2>
<a href="{% url 'lab10_p2_add' %}">Add New Book</a>
<table border="1">
    <tr>
        <th>Title</th>
        <th>Author</th>
        <th>Price</th>
        <th>Edition</th>
        <th>Actions</th>
    </tr>
    {% for book in books %}
    <tr>
        <td>{{ book.title }}</td>
        <td>{{ book.author }}</td>
        <td>{{ book.price }}</td>
        <td>{{ book.edition }}</td>
        <td>
            <a href="{% url 'lab10_p2_edit' book.id %}">Edit</a> |
            <a href="{% url 'lab10_p2_delete' book.id %}">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock content %}
